services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [docker_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DEBTSTER_API: ${DEBTSTER_API:-}
      DEBSTER_KEY: ${DEBSTER_KEY:-}
      DEBTSTER_MOCK: ${DEBTSTER_MOCK:-false}
      HTTP_ADDR: ${HTTP_ADDR:?HTTP_ADDR is required}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      STATIC_DIR: ${STATIC_DIR:?STATIC_DIR is required}
      SUPERADMIN_LOGIN: ${SUPERADMIN_LOGIN:?SUPERADMIN_LOGIN is required}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?SUPERADMIN_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [docker_network]
    restart: unless-stopped
    ports:
      - "${APP_PORT:?APP_PORT is required}:8080"

  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "webhook-proxy:80", "--url", "https://${NGROK_DOMAIN:?NGROK_DOMAIN is required}", "--log=stdout", "--log-format=json", "--log-level=info"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN is required}
    depends_on:
      webhook-proxy:
        condition: service_started
    networks: [docker_network]
    restart: unless-stopped
    init: true

  webhook-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.webhook.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_started
    networks: [docker_network]
    restart: unless-stopped

networks:
  docker_network:
    name: ${DOCKER_NETWORK:?DOCKER_NETWORK is required}
    external: true

volumes:
  postgres_data:
