services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [docker_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DEBTSTER_API: ${DEBTSTER_API:?DEBTSTER_API is required}
      HTTP_ADDR: ${HTTP_ADDR:?HTTP_ADDR is required}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      STATIC_DIR: ${STATIC_DIR:?STATIC_DIR is required}
      SUPERADMIN_LOGIN: ${SUPERADMIN_LOGIN:?SUPERADMIN_LOGIN is required}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?SUPERADMIN_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [docker_network]
    restart: unless-stopped
    ports:
      - "${APP_PORT:?APP_PORT is required}:8080"

networks:
  docker_network:
    name: ${DOCKER_NETWORK:?DOCKER_NETWORK is required}
    driver: bridge

volumes:
  postgres_data:
